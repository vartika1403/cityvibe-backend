spring.application.name=cityvibe-backend
server.port=${PORT:8080}
server.address=0.0.0.0

# Active profile: defaults to dev locally; set SPRING_PROFILES_ACTIVE=prod in production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---- JPA / datasource (shared, non-secret) ----
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# Schema is owned by Flyway migrations; Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate

# ---- Flyway (versioned schema migrations) ----
spring.flyway.enabled=true
# Adopt pre-existing databases (created earlier by ddl-auto) without failing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---- CORS ----
# Comma-separated list of allowed origins. Defaults to * for local dev only;
# in prod set CORS_ALLOWED_ORIGINS to your real frontend/app origin(s).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ---- Ticketmaster (secret supplied via env only, no fallback in repo) ----
ticketmaster.api-key=${TICKETMASTER_API_KEY:}

# ---- SerpApi Google Events (secret supplied via env only, no fallback in repo) ----
serpapi.api-key=${SERPAPI_API_KEY:}

# ---- Admin token guarding write/seed endpoints (env only) ----
# Blank disables the seed endpoint: TicketmasterSeedController fails closed.
app.admin.seed-token=${ADMIN_SEED_TOKEN:}

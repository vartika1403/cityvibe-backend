# Production profile. All secrets come from environment variables — no defaults.
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD, TICKETMASTER_API_KEY,
# ADMIN_SEED_TOKEN, CORS_ALLOWED_ORIGINS

# Local convenience: if a prod.env sits at the working directory, load it so the
# prod profile can be run locally without exporting anything first.
# Absent in real deployments, where the platform injects the variables directly;
# `optional:` keeps startup working when the file is missing. Real environment
# variables still win, since they are a higher-precedence property source.
spring.config.import=optional:file:./prod.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Schema is managed by Flyway; ddl-auto=validate is set in application.properties.

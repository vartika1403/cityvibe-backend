# Production profile. Deployments supply DB_URL, DB_USERNAME, DB_PASSWORD,
# TICKETMASTER_API_KEY, ADMIN_SEED_TOKEN and CORS_ALLOWED_ORIGINS as environment
# variables.
#
# The datasource values deliberately have no fallback. A localhost default was
# tried and removed: a deployment missing DB_URL silently connected to its own
# container and failed with "Communications link failure", which reads as a
# database outage rather than as missing configuration, and took several deploys
# to trace. ProdEnvironmentPostProcessor now refuses to start without them and
# names the ones that are absent.
#
# Locally these come from a prod.env, loaded by that same post-processor, which
# is also how the secrets without defaults (SERPAPI_API_KEY, ADMIN_SEED_TOKEN)
# are supplied.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Schema is managed by Flyway; ddl-auto=validate is set in application.properties.

# Production profile. All secrets come from environment variables — no defaults.
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD, TICKETMASTER_API_KEY,
# ADMIN_SEED_TOKEN, CORS_ALLOWED_ORIGINS
#
# A local prod.env, if present, is loaded by ProdEnvironmentPostProcessor, which
# also fails fast when these values are missing. Real environment variables take
# precedence over that file, so deployments are unaffected by it.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Schema is managed by Flyway; ddl-auto=validate is set in application.properties.

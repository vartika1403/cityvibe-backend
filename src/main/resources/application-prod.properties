# Production profile. Deployments supply DB_URL, DB_USERNAME, DB_PASSWORD,
# TICKETMASTER_API_KEY, ADMIN_SEED_TOKEN and CORS_ALLOWED_ORIGINS as environment
# variables, which override everything below.
#
# The datasource values fall back to the local MySQL instance so the profile can
# be started without configuring anything. Note the consequence: a deployment
# that forgets to set DB_URL will not fail — it will try localhost and report a
# connection error rather than a missing-configuration one.
#
# Secrets with no fallback (SERPAPI_API_KEY, ADMIN_SEED_TOKEN) come from a local
# prod.env, loaded by ProdEnvironmentPostProcessor.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cityvibe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:cityvibe}
spring.datasource.password=${DB_PASSWORD:cityvibe123}
# Schema is managed by Flyway; ddl-auto=validate is set in application.properties.
